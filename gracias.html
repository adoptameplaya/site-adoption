<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>¡Listo! | Adopta Me Playa</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="img/ui/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="img/ui/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="img/ui/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="img/ui/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="css/fonts/baloo2-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="css/fonts/nunito-latin.woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=63">
<style>
  .gracias{min-height:100dvh;display:grid;place-items:center;padding:clamp(24px,6vw,64px) var(--gutter)}
  .gracias__caja{
    max-width:620px;text-align:center;
    background:var(--crema-2);border:var(--borde);border-radius:var(--r-xl);
    padding:clamp(28px,5vw,52px);box-shadow:var(--sombra-suave);
  }
  .gracias__caja img{width:112px;height:auto;margin:0 auto 20px}
  .gracias__caja h1{font-size:clamp(1.9rem,5vw,2.8rem)}
  .gracias__caja p{color:var(--tinta-60);margin-top:16px;font-size:1.06rem}
  .gracias__caja .btn{margin-top:30px}
  .gracias__opciones{display:grid;gap:14px;margin-top:26px}
  .gracias__opciones .btn{margin-top:0;width:100%;justify-content:center}
  .gracias__especie{margin-top:26px}
  .gracias__especie:first-of-type{margin-top:0}
  .gracias__especie h2{font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-60);margin:0 0 12px}
  .gracias__ayuda{font-size:.98rem;margin-top:26px}
  .gracias__wa{margin-top:22px}
  .gracias__wa a{font-weight:800;color:var(--tinta)}
  .gracias__correo{font-size:.92rem;margin-top:22px}
</style>
</head>
<body>
<main class="gracias">
  <div class="gracias__caja">
    <img src="img/ui/logo-180.png" alt="" width="112" height="112">
    <h1 id="g-titulo"></h1>
    <p id="g-texto"></p>
    <div id="g-opciones" hidden></div>
    <p class="gracias__ayuda" id="g-ayuda" hidden></p>
    <p class="gracias__wa" id="g-wa-texto-simple" hidden><a id="g-wa-link" href="#" target="_blank" rel="noopener"></a></p>
    <p class="gracias__correo" id="g-correo" hidden></p>
    <div class="gracias__wa" id="g-wa" hidden>
      <a class="btn" id="g-wa-boton" href="#" target="_blank" rel="noopener">
        <span id="g-wa-texto"></span>
      </a>
      <p id="g-wa-ayuda"></p>
    </div>
    <p><a class="btn btn--claro" href="index.html" id="g-volver"></a></p>
  </div>
</main>

<script src="js/i18n.js?v=55"></script>
<script>
/* Page d'arrivée après l'envoi du formulaire. FormSubmit n'y renvoie aucune
   donnée : la langue passe par ?lang=, posée par app.js dans le champ _next. */
(() => {
  const params = new URLSearchParams(location.search);
  const guardado = localStorage.getItem('idioma');
  const idioma = ['es', 'en'].includes(params.get('lang')) ? params.get('lang')
               : (['es', 'en'].includes(guardado) ? guardado : 'es');
  const T = window.TEXTOS[idioma] || window.TEXTOS.es;

  document.documentElement.lang = T['html.lang'];
  /* Deux provenances : le mini-formulaire (on attend un mail) et le
     questionnaire complet (on propose le ping WhatsApp au refuge). */
  const deCuestionario = params.get('de') === 'cuestionario';
  document.title = (deCuestionario ? T['cue.ok_t'] : T['sol.ok_t']) + ' | Adopta Me Playa';
  document.getElementById('g-titulo').textContent = deCuestionario ? T['cue.ok_t'] : T['sol.ok_t'];
  document.getElementById('g-texto').textContent  = deCuestionario ? T['cue.ok_d'] : T['sol.ok_gracias'];
  document.getElementById('g-volver').textContent = T['sol.volver'];

  /* Venimos del mini-formulario : se ofrece el cuestionario AQUÍ MISMO, en línea o en PDF
     (el correo con los mismos enlaces llega aparte, FormSubmit solo envía texto). */
  if (!deCuestionario) {
    const ESPECIES = ['perro', 'gato'];
    const pedida = params.get('especie');
    const lista = ESPECIES.includes(pedida) ? [pedida] : ESPECIES;       // sin dato : las dos
    const animal = params.get('animal') || '';
    Promise.all([
      fetch('data/config.json').then(r => r.json()),
      fetch('data/cuestionario.json').then(r => r.json()).catch(() => ({}))
    ]).then(([c, q]) => {
      const cont = document.getElementById('g-opciones');
      for (const esp of lista) {
        const pdf = c.solicitud?.formularios?.[esp]?.[idioma] || '';
        const hayWeb = !!q?.[esp]?.secciones?.length;
        if (!pdf && !hayWeb) continue;
        const bloque = document.createElement('div');
        bloque.className = 'gracias__especie';
        if (lista.length > 1) {
          const h = document.createElement('h2');
          h.textContent = T[esp === 'gato' ? 'gra.gatos' : 'gra.perros'];
          bloque.appendChild(h);
        }
        const caja = document.createElement('div');
        caja.className = 'gracias__opciones';
        if (hayWeb) {
          const u = new URL('cuestionario.html', location.href);
          u.searchParams.set('especie', esp); u.searchParams.set('lang', idioma);
          if (animal) u.searchParams.set('animal', animal);
          const b = document.createElement('a');
          b.className = 'btn'; b.href = u.pathname.split('/').pop() + u.search; b.textContent = T['gra.en_linea'];
          caja.appendChild(b);
        }
        if (pdf) {
          const b = document.createElement('a');
          b.className = 'btn btn--claro'; b.href = pdf; b.setAttribute('download', ''); b.textContent = T['gra.pdf'];
          caja.appendChild(b);
        }
        bloque.appendChild(caja);
        cont.appendChild(bloque);
      }
      if (cont.children.length) {
        cont.hidden = false;
        const ayuda = document.getElementById('g-ayuda'); ayuda.textContent = T['gra.ayuda']; ayuda.hidden = false;
        const tel = (c.contacto?.whatsapp || '').replace(/\D/g, '');
        if (tel) {
          const l = document.getElementById('g-wa-link');
          l.href = `https://wa.me/${tel}`; l.textContent = T['gra.wa'] + ' · ' + (c.contacto?.whatsapp_visible || '');
          document.getElementById('g-wa-texto-simple').hidden = false;
        }
        const co = document.getElementById('g-correo'); co.textContent = T['gra.correo']; co.hidden = false;
      }
    }).catch(() => {});
  }

  const wa = params.get('wa');
  if (deCuestionario && wa) {
    fetch('data/config.json').then(r => r.json()).then(c => {
      const tel = (c.contacto?.whatsapp || '').replace(/\D/g, '');
      if (!tel) return;
      document.getElementById('g-wa-boton').href = `https://wa.me/${tel}?text=${encodeURIComponent(wa)}`;
      document.getElementById('g-wa-texto').textContent = T['cue.wa_boton'];
      document.getElementById('g-wa-ayuda').textContent = T['cue.wa_ayuda'];
      document.getElementById('g-wa').hidden = false;
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
