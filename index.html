<!-- ================= BARRA ================= -->
<header class="barra">
  <div class="contenedor barra__fila">
    <a class="marca" href="#inicio">
      <img class="marca__logo" src="img/ui/logo.png" alt="" width="58" height="58" fetchpriority="high">
      <span>
        <span class="marca__nombre" data-refugio="nombre">Adopta Me Playa</span><span class="marca__nombre marca__nombre--corto" data-refugio="nombre_corto">Adopta Me</span>
        <span class="marca__lugar" data-i18n="marca.lugar"></span>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a href="#adoptar" data-i18n="nav.adoptar"></a>
      <a href="#como" data-i18n="nav.como"></a>
      <a href="#solicitud" data-i18n="nav.solicitud"></a>
      <a href="#apoyar" data-i18n="nav.apoyar"></a>
      <a href="#contacto" data-i18n="nav.contacto"></a>
    </nav>

    <div class="barra__acciones">
      <div class="idioma" role="group" aria-label="Idioma / Language">
        <button type="button" data-idioma="es" aria-pressed="true">ES</button>
        <button type="button" data-idioma="en" aria-pressed="false">EN</button>
      </div>
      <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">
        <span class="solo-lectores" data-i18n="nav.abrir"></span>
        <svg aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
    </div>
  </div>
</header>

<main id="inicio">

<!-- ================= HERO ================= -->
<section class="hero">
  <h2 class="solo-lectores" data-i18n="hero.tira"></h2>
  <div class="contenedor">
    <div class="tira" id="tira" aria-label="Peludos en adopción"></div>

    <div class="hero__cuerpo">
      <div>
        <p class="epigrafe" data-i18n="hero.epigrafe"></p>
        <h1>
          <span data-i18n="hero.h1a"></span><br>
          <span class="resalte" data-i18n="hero.h1b"></span>
          <span data-i18n="hero.h1c"></span>
        </h1>
        <p class="hero__lead" data-i18n="hero.lead"></p>
        <div class="hero__botones">
          <a class="btn btn--grande" href="#adoptar"><span data-i18n="hero.cta1"></span><svg aria-hidden="true"><use href="#i-flecha"></use></svg></a>
          <a class="btn btn--claro btn--grande" href="#apoyar"><svg aria-hidden="true"><use href="#i-corazon"></use></svg><span data-i18n="hero.cta2"></span></a>
        </div>
      </div>


    </div>

    <figure class="hero__familia">
      <img src="img/ui/familia.webp" width="1344" height="752" fetchpriority="high"
           data-i18n-attr="alt:hero.familia_alt" alt="">
    </figure>
  </div>
</section>

<!-- ================= PASOS ================= -->
<section class="seccion" id="como">
  <div class="contenedor">
    <p class="epigrafe" data-i18n="pasos.epigrafe"></p>
    <h2 data-i18n="pasos.h2"></h2>
    <p class="seccion__intro" data-i18n="pasos.intro"></p>

    <div class="pasos">
      <article class="paso"><h3 data-i18n="paso1.t"></h3><p data-i18n="paso1.d"></p></article>
      <article class="paso"><h3 data-i18n="paso2.t"></h3><p data-i18n="paso2.d"></p></article>
      <article class="paso"><h3 data-i18n="paso3.t"></h3><p data-i18n="paso3.d"></p></article>
      <article class="paso"><h3 data-i18n="paso4.t"></h3><p data-i18n="paso4.d"></p></article>
    </div>
  </div>
</section>

<!-- ================= CATÁLOGO ================= -->
<section class="seccion catalogo" id="adoptar">
  <div class="contenedor">
    <p class="epigrafe" data-i18n="cat.epigrafe"></p>
    <h2 data-i18n="cat.h2"></h2>
    <p class="seccion__intro" data-i18n="cat.intro"></p>

    <div class="filtros">
      <div class="filtros__fila">
        <label class="buscador">
          <svg aria-hidden="true"><use href="#i-buscar"></use></svg>
          <span class="solo-lectores" data-i18n="cat.buscar"></span>
          <input type="search" id="buscar" data-i18n-attr="placeholder:cat.buscar" autocomplete="off">
        </label>
        <button class="pastilla" type="button" data-filtro="especie" data-valor="todos" aria-pressed="true"><span data-i18n="cat.todos"></span></button>
        <button class="pastilla" type="button" data-filtro="especie" data-valor="perro" aria-pressed="false"><svg aria-hidden="true"><use href="#i-perro"></use></svg><span data-i18n="cat.perros"></span></button>
        <button class="pastilla" type="button" data-filtro="especie" data-valor="gato" aria-pressed="false"><svg aria-hidden="true"><use href="#i-gato"></use></svg><span data-i18n="cat.gatos"></span></button>
      </div>

      <div class="filtros__fila">
        <div class="filtros__grupo">
          <span class="filtros__etiqueta" data-i18n="cat.tamano"></span>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="tamano" data-valor="chico" aria-pressed="false" data-i18n="cat.chico"></button>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="tamano" data-valor="mediano" aria-pressed="false" data-i18n="cat.mediano"></button>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="tamano" data-valor="grande" aria-pressed="false" data-i18n="cat.grande"></button>
        </div>
        <div class="filtros__grupo">
          <span class="filtros__etiqueta" data-i18n="cat.energia"></span>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="energia" data-valor="baja" aria-pressed="false" data-i18n="cat.e_baja"></button>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="energia" data-valor="media" aria-pressed="false" data-i18n="cat.e_media"></button>
          <button class="pastilla pastilla--tenue" type="button" data-filtro="energia" data-valor="alta" aria-pressed="false" data-i18n="cat.e_alta"></button>
        </div>
        <button class="pastilla pastilla--tenue" type="button" id="limpiar" data-i18n="cat.limpiar"></button>
      </div>
    </div>

    <p class="conteo" id="conteo" role="status" aria-live="polite"></p>
    <ul class="rejilla" id="rejilla"></ul>
  </div>
</section>

<!-- ================= FICHA ================= -->
<dialog class="ficha" id="ficha" aria-labelledby="ficha-nombre">
  <div class="ficha__caja">
    <button class="ficha__cerrar" type="button" id="ficha-cerrar">
      <span class="solo-lectores" data-i18n="ficha.cerrar"></span>
      <svg aria-hidden="true"><use href="#i-cerrar"></use></svg>
    </button>
    <div class="ficha__cuerpo" id="ficha-cuerpo"></div>
  </div>
</dialog>

<!-- ================= SOLICITUD ================= -->
<section class="seccion solicitud" id="solicitud">
  <div class="contenedor">
    <p class="epigrafe" data-i18n="sol.epigrafe"></p>
    <h2 data-i18n="sol.h2"></h2>
    <p class="seccion__intro" data-i18n="sol.intro"></p>

    <div class="solicitud__aviso">
      <h3 data-i18n="sol.aviso_t"></h3>
      <p data-i18n-html="sol.aviso_d"></p>
    </div>

    <form class="pedido" id="pedido" method="POST" novalidate>
      <!-- champs techniques FormSubmit, remplis par app.js au moment de l'envoi -->
      <input type="hidden" name="_subject" value="">
      <input type="hidden" name="_autoresponse" value="">
      <input type="hidden" name="_next" value="">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="name" value="">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <fieldset class="especie">
        <legend data-i18n="sol.especie"></legend>
        <p class="especie__ayuda" data-i18n="sol.especie_ayuda"></p>
        <div class="especie__opciones">
          <label class="especie__btn">
            <input type="radio" name="especie" value="perro" required>
            <svg aria-hidden="true"><use href="#i-perro"></use></svg>
            <span data-i18n="cat.perro"></span>
          </label>
          <label class="especie__btn">
            <input type="radio" name="especie" value="gato" required>
            <svg aria-hidden="true"><use href="#i-gato"></use></svg>
            <span data-i18n="cat.gato"></span>
          </label>
        </div>
      </fieldset>

      <div class="campos">
        <p class="campo">
          <label for="p-nombre" data-i18n="sol.nombre"></label>
          <input id="p-nombre" name="nombre" required autocomplete="given-name" placeholder=" ">
        </p>
        <p class="campo">
          <label for="p-apellido" data-i18n="sol.apellido"></label>
          <input id="p-apellido" name="apellido" required autocomplete="family-name" placeholder=" ">
        </p>
        <p class="campo campo--ancho">
          <label for="p-email" data-i18n="sol.email"></label>
          <input id="p-email" name="email" type="email" required autocomplete="email" placeholder=" ">
          <span class="ayuda" data-i18n="sol.email_ayuda"></span>
        </p>
        <p class="campo campo--ancho">
          <label for="p-animal" data-i18n="sol.animal"></label>
          <select id="p-animal" name="animal"></select>
          <span class="ayuda" data-i18n="sol.animal_ayuda"></span>
        </p>
      </div>

      <div class="enviar">
        <button class="btn btn--grande" type="submit" id="pedido-enviar">
          <svg aria-hidden="true"><use href="#i-sobre"></use></svg>
          <span data-i18n="sol.enviar"></span>
        </button>
        <span class="enviar__nota" data-i18n="sol.privacidad"></span>
      </div>

      <div class="pedido__estado oculto" id="pedido-estado" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<!-- ================= APOYAR ================= -->
<section class="seccion" id="apoyar">
  <div class="contenedor">
    <p class="epigrafe" data-i18n="ap.epigrafe"></p>
    <h2 data-i18n-html="ap.h2"></h2>
    <p class="seccion__intro" data-i18n="ap.intro"></p>

    <!-- 1. Donner de son temps : ce qui manque le plus au refuge -->
    <div class="apoyo__rejilla apoyo__rejilla--dos">
      <article class="medio medio--tiempo">
        <span class="medio__icono" style="background:var(--blanco)"><svg aria-hidden="true"><use href="#i-mano"></use></svg></span>
        <h3 data-i18n="ap.volun_t"></h3>
        <p class="medio__cuerpo" data-i18n="ap.volun_d"></p>
        <a class="btn btn--bloque" id="wa-voluntario" target="_blank" rel="noopener" href="#">
          <svg aria-hidden="true"><use href="#i-wa"></use></svg><span data-i18n="ap.volun_b"></span>
        </a>
      </article>

      <article class="medio medio--tiempo">
        <span class="medio__icono" style="background:var(--blanco)"><svg aria-hidden="true"><use href="#i-casa"></use></svg></span>
        <h3 data-i18n="ap.hogar_t"></h3>
